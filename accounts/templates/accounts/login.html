<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
</head>
<body>
  <h1>Вход</h1>

  {% if form.errors %}
    <p style="color: red; font-weight: bold;">
      Неверный логин или пароль. Попробуйте ещё раз.
    </p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Войти</button>
  </form>

  <p><a href="{% url 'accounts:register' %}">Регистрация</a></p>
</body>
</html>
