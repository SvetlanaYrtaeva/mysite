<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
    <h1>Вход</h1>

    {% if form.errors %}
        <div style="color: red;">
            Неверный логин или пароль.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}
        {{ form.as_p }}

        <button type="submit">
            Войти
        </button>
    </form>

    <p>
        <a href="{% url 'accounts:register' %}">
            Регистрация
        </a>
    </p>
</body>
</html>
