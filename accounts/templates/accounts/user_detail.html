{% extends "base.html" %}
{% block content %}
  <h1>Профиль: {{ user.username }}</h1>
  {% if profile.avatar %}
    <img src="{{ profile.avatar.url }}" alt="Avatar" width="150">
  {% else %}
    <p>Аватарка не установлена.</p>
  {% endif %}

    {% if can_edit %}
        <a href="{% url 'accounts:profile_update' profile.pk %}">Редактировать профиль</a>
    {% endif %}
{% endblock %}
