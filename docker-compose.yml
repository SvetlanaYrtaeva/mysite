services:
  web:
    build: .
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - .:/app
    environment:
      - DJANGO_DEBUG=1
      - DJANGO_SECRET_KEY=supersecretkeyforpractice
      - DJANGO_ALLOWED_HOSTS=*
      - PYTHONUNBUFFERED=1
    command:
      - gunicorn
      - mysite.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --timeout=120
      - --access-logfile=-
      - --error-logfile=-
