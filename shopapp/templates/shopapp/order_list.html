{% extends "base.html" %}

{% block title %}Заказы{% endblock %}

{% block content %}
<h2>Заказы</h2>

{% for order in orders %}
  <div class="card">
    <p>Заказ #{{ order.pk }}</p>
    <a href="{% url 'shopapp:order_detail' pk=order.pk %}" class="btn">Подробнее</a>
  </div>
{% empty %}
  <p>Заказов пока нет.</p>
{% endfor %}
{% endblock %}
