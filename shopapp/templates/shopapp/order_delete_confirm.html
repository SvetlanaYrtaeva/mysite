{% extends 'base.html' %}

{% block title %}Удаление заказа{% endblock %}

{% block content %}
<h1>Удаление заказа</h1>

<p>Вы уверены, что хотите удалить заказ #{{ order.pk }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'order_detail' order.pk %}">Отмена</a>
</form>
{% endblock %}
